<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Penelope – Hand Test</title>
<link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
<div id="ending" class="hidden">
  <img id="endingImg" alt="" />
  <div id="endingHint">Press Enter to play again</div>
</div>
<div id="story">
  <video id="storyVideo" src="story.mp4" playsinline preload="auto"></video>
  <div id="storyHint">Press Enter to play the story</div>
</div>
<div id="banner">
  <div id="timeWrap"><div id="timeBar"></div></div>
  <div id="bannerImgBox"><img id="bannerImg" src="titlecentered.PNG" alt="Penelofreeze - Press Enter to start" /></div>
  <div id="bannerSub"></div>
</div>
<div id="ropes"><img src="ropecentered.PNG" alt="" /></div>
<div id="tapestry">
  <img id="tapGhost" src="tapestry.jpg" alt="" />
  <img id="tapImg" src="tapestry.jpg" alt="Penelope's tapestry" />
</div>
<div id="candleBox">
  <img id="candle" src="candle1.GIF" alt="candle" />
  <div id="time">0:20</div>
</div>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" width="640" height="480"></canvas>
</div>
<img id="hands" src="updownhands.GIF" alt="" />
<img id="bird" src="bird2.png" alt="" />
<div id="hud">
  <img id="hudImg" src="buildunraveldisplaynew.PNG" alt="Build / Unravel" />
  <span id="buildNum" class="hudNum">0</span>
  <span id="unravelNum" class="hudNum">0</span>
  <!-- 코드가 아직 여기에 글자를 쓰니까 지우지 말고 숨겨만 둠 -->
  <div id="hudDebug">
    <span id="status"></span><span id="weaveCount"></span><span id="unravelCount"></span>
    <span id="dress"></span><span id="rounds"></span><span id="handState"></span><span id="flash"></span>
  </div>
</div>
<script type="module" src="main.js?v=2"></script>
<script type="module" src="game.js?v=3"></script>
</body>
</html>
